[package]
name = "arkup"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["arkana-team"]
description = "Signed system update packs for arkanaOS"
license = "GPL-3.0"

[[bin]]
name = "arkup"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "2.2"
flate2 = "1.1"
hex = "0.4"
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.10"
walkdir = "2.5"
zeroize = "1.8"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
