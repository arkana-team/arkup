name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
        env:
          CARGO_BUILD_JOBS: 1
      - run: cargo clippy --locked --all-targets -- -D warnings
        env:
          CARGO_BUILD_JOBS: 1
