version: 2
updates:
  # arkup's whole job is verifying signatures and unpacking archives, so its
  # crypto, tar, and gzip dependencies need timely security updates.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
